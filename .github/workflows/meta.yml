name: Weekly meta update
on:
  schedule:
    - cron: '17 3 * * 1'   # Mondays 03:17 UTC (10:17 WIB)
  workflow_dispatch:
    inputs:
      dump:
        description: 'Upload raw HTML for debugging'
        type: boolean
        default: false
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Fetch BEYWATCH data
        run: node scripts/fetch-meta.mjs
        env:
          DUMP: ${{ inputs.dump && '1' || '' }}
      - name: Upload raw HTML
        if: ${{ inputs.dump }}
        uses: actions/upload-artifact@v4
        with: { name: raw-html, path: raw/ }
      - name: Commit if changed
        run: |
          git config user.name "beyvault-bot"
          git config user.email "actions@users.noreply.github.com"
          git add meta.json
          git diff --cached --quiet || (git commit -m "Weekly meta update" && git push)
